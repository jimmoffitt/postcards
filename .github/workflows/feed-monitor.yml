# Emails/texts when a Bluesky feed misses a scheduled post. See app/feed_monitor.py.
# Secrets: GMAIL_ADDRESS, GMAIL_APP_PASSWORD, ALERT_TO.
name: Feed monitor

on:
  schedule:
    - cron: "17 * * * *"     # hourly; GitHub may run it late or skip a run under load
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert"
        type: boolean
        default: false

concurrency: feed-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: monitor_state.json
          key: feed-monitor-state-${{ github.run_id }}
          restore-keys: feed-monitor-state-
      - name: Check feeds
        working-directory: app
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MONITOR_STATE: ${{ github.workspace }}/monitor_state.json
        run: python feed_monitor.py ${{ inputs.test && '--test' || '' }}
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor_state.json
          key: feed-monitor-state-${{ github.run_id }}
