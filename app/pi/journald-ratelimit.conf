# Drop-in for the bots that log a warning every few seconds while offline
# (weather-bot, snowbot). Installed as
#   /etc/systemd/system/<unit>.service.d/ratelimit.conf
# Over 20 lines a minute, journald drops the rest and logs how many it dropped.
# In Nov 2026 their offline warnings filled the 205 MB journal and pushed out
# the record of when the Wi-Fi failed.
[Service]
LogRateLimitIntervalSec=60s
LogRateLimitBurst=20
