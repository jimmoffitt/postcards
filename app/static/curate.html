<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Postcards curation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #16181c; color: #e6e6e6;
         height: 100vh; display: flex; flex-direction: column; }
  .stream-info { padding: 8px 14px; font-size: 13px; background: #1c2230; border-bottom: 1px solid #2a2d34; color: #cdd6e4; }
  .stream-info.paused { background: #2e2616; color: #e8d6a8; }
  .stream-info b { color: #fff; font-weight: 600; }

  .layout { display: grid; grid-template-columns: 300px 1fr; flex: 1; min-height: 0; }

  .sidebar { border-right: 1px solid #2a2d34; display: flex; flex-direction: column; overflow: hidden; }
  .filters { padding: 12px; border-bottom: 1px solid #2a2d34; display: flex; flex-direction: column; gap: 8px; }
  .filters select, .filters input { background: #22252b; border: 1px solid #383c44; color: #e6e6e6; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  .filters label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .04em; }
  .date-row { display: flex; gap: 6px; }
  .date-row input { flex: 1; min-width: 0; }
  .count { font-size: 12px; color: #888; padding: 8px 12px; }

  .list { overflow-y: auto; flex: 1; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #22252b; }
  .list-item:hover { background: #1e2127; }
  .list-item.selected { background: #23334a; }
  .list-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; background: #000; flex-shrink: 0; }
  .list-item .info { min-width: 0; }
  .list-item .fname { font-size: 12px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item .tag { font-size: 10px; color: #7ab; }
  .list-item.posted .fname { color: #666; }
  .list-item.curated .tag { color: #7c7; }
  .list-item.up-next .tag { color: #e0b050; }
  .list-item .badge { font-size: 10px; color: #e0b050; margin-left: 4px; }
  .status-switch { display: flex; border: 1px solid #383c44; border-radius: 6px; overflow: hidden; width: fit-content; }
  .status-switch button { background: #22252b; color: #bbb; border-radius: 0; padding: 7px 14px; }
  .status-switch button + button { border-left: 1px solid #383c44; }
  .status-switch button.on { background: #2563eb; color: #fff; }
  .status-switch button.on[data-status="up-next"] { background: #b7791f; }
  .status-note { font-size: 12px; color: #888; margin-top: 4px; }

  .editor { display: flex; flex-direction: column; overflow: hidden; }
  .editor-top { display: flex; gap: 20px; padding: 20px; overflow-y: auto; flex: 1; }
  .editor-image { flex: 0 0 45%; }
  .editor-image img { width: 100%; border-radius: 8px; background: #000; display: block; }
  .editor-fields { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 300px; }
  .field label { display: block; font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .field textarea, .field input { width: 100%; background: #22252b; border: 1px solid #383c44; color: #e6e6e6; border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .meta-line { font-size: 12px; color: #888; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 14px 20px; border-top: 1px solid #2a2d34; }
  button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  button.secondary { background: #383c44; }
  button.danger { background: #7a2222; margin-left: auto; }
  button.danger:hover { background: #952b2b; }
  button:disabled { opacity: .5; cursor: default; }
  .preview { white-space: pre-wrap; background: #1b1e23; border: 1px dashed #383c44; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: #bbb; }
  .preview .count { padding: 0; margin-top: 4px; font-size: 11px; }
  .status { font-size: 12px; color: #7c7; margin-left: auto; }
  .list-item input[type=checkbox] { flex-shrink: 0; margin: 0; accent-color: #2563eb; }
  .list-item .check-spacer { width: 13px; flex-shrink: 0; }
  .list-item .mini { width: 40px; height: 40px; flex-shrink: 0; }
  .list-item.group .tag { color: #a9a0f0; }
  .group-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #2a2d34; font-size: 12px; color: #aaa; }
  .group-bar button { padding: 5px 10px; font-size: 12px; }
  .group-bar[hidden] { display: none; }
  .list-item .pos { font-size: 12px; color: #e0b050; min-width: 18px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .list-item .order { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .list-item .order button { background: #2a2d34; color: #ccc; padding: 2px 6px; font-size: 11px; border-radius: 4px; }
  .list-item .order button:hover:not(:disabled) { background: #3a3f48; color: #fff; }

  /* Photos laid out the way the feed's platform shows a multi-image post:
     Bluesky's 2-4 photo grids, or an Instagram carousel (swiped sideways) */
  .mosaic { display: grid; gap: 3px; border-radius: 8px; overflow: hidden; background: #000; }
  .mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 0; }
  .mosaic.n2 { grid-template-columns: 1fr 1fr; aspect-ratio: 2 / 1; }
  .mosaic.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 3 / 2; }
  .mosaic.n3 img:first-child { grid-row: 1 / 3; }
  .mosaic.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 3 / 2; }
  .mosaic.mini { gap: 1px; border-radius: 4px; aspect-ratio: auto; }
  .mosaic.carousel { display: flex; gap: 4px; overflow-x: auto; background: none; scroll-snap-type: x mandatory; }
  .mosaic.carousel img { height: 340px; width: auto; max-width: 85%; object-fit: contain; background: #000;
                         border-radius: 6px; scroll-snap-align: start; flex-shrink: 0; }
  .group-photo { display: flex; gap: 12px; align-items: flex-start; padding: 10px; background: #1b1e23; border: 1px solid #2a2d34; border-radius: 8px; }
  .group-photo > img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0; }
  .group-photo .field { flex: 1; }
  .group-photo .field label { text-transform: none; font-family: monospace; }
  .group-photo .actions { display: flex; gap: 6px; margin-top: 6px; }
  .group-photo .actions button { padding: 4px 9px; font-size: 12px; }
  .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #666; }
</style>
</head>
<body>
<div class="stream-info" id="streamInfo">&nbsp;</div>
<div class="layout">
  <div class="sidebar">
    <div class="filters">
      <div>
        <label>Account</label>
        <select id="account"></select>
      </div>
      <div>
        <label>Status</label>
        <select id="status">
          <option value="holding-pen" selected>Holding pen</option>
          <option value="curated">Curated</option>
          <option value="up-next">Up next</option>
          <option value="posted">Posted</option>
          <option value="all">All</option>
        </select>
      </div>
      <div>
        <label>Search (filename / alt text)</label>
        <input id="q" type="text" placeholder="e.g. IMG_1234 or lake">
      </div>
      <div>
        <label>Geo metadata</label>
        <select id="hasGeo">
          <option value="">Any</option>
          <option value="true">Has location</option>
          <option value="false">No location</option>
        </select>
      </div>
      <div>
        <label>Alt text</label>
        <select id="hasAlt">
          <option value="">Any</option>
          <option value="true">Has alt text</option>
          <option value="false">No alt text</option>
        </select>
      </div>
      <div>
        <label>Date taken</label>
        <div class="date-row">
          <input id="dateFrom" type="date">
          <input id="dateTo" type="date">
        </div>
      </div>
      <div>
        <button class="secondary" id="btnSyncLocations" style="width:100%">Sync locations &rarr; alt text</button>
        <div class="meta-line" id="syncResult" style="margin-top:6px"></div>
      </div>
    </div>
    <div class="count" id="count"></div>
    <div class="group-bar" id="groupBar" hidden>
      <span id="groupBarText"></span>
      <button id="btnGroup">Group</button>
      <button class="secondary" id="btnClearChecks">Clear</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="editor" id="editor">
    <div class="empty">Select a photo</div>
  </div>
</div>

<script>
let photos = [];
let selectedIndex = -1;
let currentAccount = null;
let placeOptions = [];
let allAccounts = [];
let checked = [];  // filenames ticked for grouping, in the order ticked
// The current feed's platform and what it allows in one post (from /api/stream).
let platform = 'bluesky';
let limits = {name: 'Bluesky', max_photos: 4, max_chars: 300, max_hashtags: null};

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const imgUrl = (filename) => `/api/photos/${currentAccount}/${encodeURIComponent(filename)}/image`;
const imgs = (filenames) => filenames.map(f => `<img src="${imgUrl(f)}" loading="lazy">`).join('');
function mosaic(filenames, cls = '') {
  if (cls === 'mini') {  // the list's thumbnail: at most a 2x2 grid
    const shown = filenames.slice(0, 4);
    return `<div class="mosaic n${shown.length} mini">${imgs(shown)}</div>`;
  }
  if (platform === 'instagram') return `<div class="mosaic carousel">${imgs(filenames)}</div>`;
  return `<div class="mosaic n${filenames.length} ${cls}">${imgs(filenames)}</div>`;
}
// The photo whose status stands for the whole item (a group's photos share one).
const itemFilename = (p) => p.kind === 'group' ? p.photos[0].filename : p.filename;
// How the up-next order refers to an item: a group's id, or the photo's filename.
const itemKey = (p) => p.kind === 'group' ? p.id : p.filename;
const isOrderView = () => $('status').value === 'up-next';

function orderControls(p, i) {
  if (!isOrderView()) return '';
  const last = i === photos.length - 1;
  return `<span class="order">
    <button title="Move to the top" data-order="top" data-idx="${i}" ${p.queue_pos === 1 ? 'disabled' : ''}>Top</button>
    <button title="Move up" data-order="up" data-idx="${i}" ${i === 0 ? 'disabled' : ''}>&#x25B2;</button>
    <button title="Move down" data-order="down" data-idx="${i}" ${last ? 'disabled' : ''}>&#x25BC;</button>
  </span>`;
}

async function moveInUpNext(i, how) {
  const p = photos[i];
  const body = {key: itemKey(p)};
  if (how === 'top') body.to = 'top';
  else if (how === 'up') body.before = itemKey(photos[i - 1]);
  else body.after = itemKey(photos[i + 1]);
  if (photos[selectedIndex]) await save();  // keep unsaved edits to the open item
  const resp = await fetch(`/api/up-next/${currentAccount}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  if (!resp.ok) { alert(`Couldn\u2019t reorder: ${await resp.text().catch(() => resp.statusText)}`); return; }
  await loadPhotos(body.key);  // reload in the new order, keeping the moved item selected
}

const $ = (id) => document.getElementById(id);

async function loadAccounts() {
  allAccounts = await fetch('/api/accounts').then(r => r.json());
  $('account').innerHTML = allAccounts.map(a => `<option value="${a}">${a}</option>`).join('');
  currentAccount = allAccounts[0];
}

async function loadPlaceOptions() {
  placeOptions = await fetch(`/api/places/${currentAccount}`).then(r => r.json());
}

function filterParams() {
  const p = new URLSearchParams();
  p.set('status', $('status').value);
  if ($('q').value) p.set('q', $('q').value);
  if ($('hasGeo').value) p.set('has_geo', $('hasGeo').value);
  if ($('hasAlt').value) p.set('has_alt', $('hasAlt').value);
  if ($('dateFrom').value) p.set('date_from', $('dateFrom').value);
  if ($('dateTo').value) p.set('date_to', $('dateTo').value);
  return p;
}

let loadRequestId = 0;

async function loadStreamInfo() {
  const el = $('streamInfo');
  try {
    const info = await fetch(`/api/stream/${currentAccount}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    el.textContent = info.summary;
    el.title = `Posts at ${info.slots.join(', ')} ${info.timezone} (${info.posts_per_day}/day). ` +
               `${info.curated} ready (${info.up_next} up next), ${info.holding_pen} in the holding pen.`;
    el.classList.toggle('paused', !info.enabled);
    platform = info.platform;
    limits = info.limits;
  } catch (err) {
    el.textContent = `Couldn't read the stream settings (feeds.json): ${err.message}`;
  }
}

async function loadPhotos(selectKey = null) {
  const accountChanged = currentAccount !== $('account').value;
  currentAccount = $('account').value;
  if (accountChanged) await loadPlaceOptions();
  const params = filterParams();
  const requestId = ++loadRequestId;

  $('count').textContent = 'Loading…';
  let resp;
  try {
    resp = await fetch(`/api/photos/${currentAccount}?${params}`);
  } catch (err) {
    if (requestId === loadRequestId) $('count').textContent = `Load failed: ${err.message}`;
    return;
  }
  if (requestId !== loadRequestId) return; // a newer filter change superseded this request

  if (!resp.ok) {
    const text = await resp.text().catch(() => resp.statusText);
    $('count').textContent = `Load failed (${resp.status})`;
    console.error('Failed to load photos:', resp.status, text);
    return;
  }

  photos = await resp.json();
  checked = [];
  await loadStreamInfo();  // the feed's platform limits, before rendering
  const keep = selectKey ? photos.findIndex(p => itemKey(p) === selectKey) : -1;
  selectedIndex = keep >= 0 ? keep : photos.length ? 0 : -1;
  renderList();
  renderEditor();
}

function renderList() {
  const groupCount = photos.filter(p => p.kind === 'group').length;
  $('count').textContent = `${photos.length} item(s)` + (groupCount ? `, ${groupCount} of them group(s)` : '');
  const upNextBadge = (p) => p.status === 'up-next' && $('status').value !== 'up-next' ? '<span class="badge">UP NEXT</span>' : '';
  $('list').innerHTML = photos.map((p, i) => p.kind === 'group' ? `
    <div class="list-item group ${p.status} ${i === selectedIndex ? 'selected' : ''}" data-idx="${i}">
      ${isOrderView() ? `<span class="pos">${p.queue_pos}</span>` : '<span class="check-spacer"></span>'}
      ${mosaic(p.photos.map(x => x.filename), 'mini')}
      <div class="info">
        <div class="fname">Group of ${p.photos.length}${upNextBadge(p)}</div>
        <div class="tag">${esc(p.message || p.place || p.photos.map(x => x.filename).join(', '))}</div>
      </div>
      ${orderControls(p, i)}
    </div>` : `
    <div class="list-item ${p.status} ${i === selectedIndex ? 'selected' : ''}" data-idx="${i}">
      ${isOrderView() ? `<span class="pos">${p.queue_pos}</span>` : ''}
      ${p.status === 'posted' ? '<span class="check-spacer"></span>'
        : `<input type="checkbox" title="Tick 2\u2013${limits.max_photos} photos, then Group" data-file="${esc(p.filename)}" ${checked.includes(p.filename) ? 'checked' : ''}>`}
      <img src="${imgUrl(p.filename)}" loading="lazy">
      <div class="info">
        <div class="fname">${p.filename}${upNextBadge(p)}</div>
        <div class="tag">${p.place || (p.alt_text ? '' : 'needs alt text')}</div>
      </div>
      ${orderControls(p, i)}
    </div>
  `).join('');
  [...document.querySelectorAll('.list-item')].forEach(el => {
    el.addEventListener('click', () => { selectedIndex = parseInt(el.dataset.idx); renderList(); renderEditor(); });
  });
  [...document.querySelectorAll('.list-item input[type=checkbox]')].forEach(cb => {
    cb.addEventListener('click', (e) => {
      e.stopPropagation();  // ticking doesn't open the photo
      const f = cb.dataset.file;
      checked = cb.checked ? [...checked, f] : checked.filter(x => x !== f);
      renderGroupBar();
    });
  });
  [...document.querySelectorAll('.list-item .order button')].forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();  // moving doesn't open the item
      moveInUpNext(parseInt(btn.dataset.idx), btn.dataset.order);
    });
  });
  renderGroupBar();
}

function renderGroupBar() {
  const n = checked.length;
  $('groupBar').hidden = n === 0;
  const max = limits.max_photos;
  $('groupBarText').textContent = n > max ? `${n} ticked \u2014 a ${limits.name} post holds at most ${max}`
    : n < 2 ? `${n} ticked \u2014 tick 2\u2013${max} to group` : `${n} photos ticked`;
  $('btnGroup').disabled = n < 2 || n > max;
}

async function createGroup() {
  if (photos[selectedIndex]) await save();  // keep unsaved edits to the open item
  const statuses = new Set(checked.map(f => photos.find(p => p.filename === f)?.status));
  const resp = await fetch(`/api/groups/${currentAccount}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({photos: checked})
  });
  if (!resp.ok) { alert(`Couldn\u2019t group: ${await resp.text().catch(() => resp.statusText)}`); return; }
  const group = await resp.json();
  if (statuses.size > 1) alert('These photos had different statuses, so the group was put in the Holding pen.');
  await loadPhotos();
  const idx = photos.findIndex(p => p.kind === 'group' && p.id === group.id);
  if (idx >= 0) { selectedIndex = idx; renderList(); renderEditor(); }
}

function renderEditor() {
  const editor = $('editor');
  if (selectedIndex < 0 || !photos[selectedIndex]) {
    editor.innerHTML = '<div class="empty">Select a photo</div>';
    return;
  }
  const p = photos[selectedIndex];
  if (p.kind === 'group') { renderGroupEditor(p); return; }
  editor.innerHTML = `
    <div class="editor-top">
      <div class="editor-image">
        <img src="/api/photos/${currentAccount}/${encodeURIComponent(p.filename)}/image">
        <div class="meta-line" style="margin-top:8px">${p.filename} &middot; ${p.date_taken || 'no date'} &middot; ${p.status}</div>
      </div>
      <div class="editor-fields">
        <div>
          ${p.status === 'posted' ? '<div class="status-note">Posted</div>' : `
          <div class="status-switch">
            ${STATUS_CHOICES.map(([s, label]) =>
              `<button class="${p.status === s ? 'on' : ''}" data-status="${s}">${label}</button>`).join('')}
          </div>
          <div class="status-note">${STATUS_NOTES[p.status] || ''}</div>`}
        </div>
        <div class="row">
          ${allAccounts.filter(a => a !== currentAccount).map(a =>
            `<button class="secondary move-account-btn" data-to="${a}">Move to ${a}</button>`
          ).join('')}
        </div>
        <div class="field">
          <label>Alt text</label>
          <textarea id="f_alt">${p.alt_text || ''}</textarea>
        </div>
        <div class="field">
          <label>Caption &amp; extra hashtags (optional)</label>
          <textarea id="f_msg" placeholder="Feed and location hashtags are added automatically">${p.message || ''}</textarea>
        </div>
        <div class="field">
          <label>Post preview</label>
          <div class="preview" id="f_preview"></div>
        </div>
        <div class="row">
          <div class="field">
            <label>Latitude</label>
            <input id="f_lat" type="number" step="any" value="${p.lat ?? ''}">
          </div>
          <div class="field">
            <label>Longitude</label>
            <input id="f_lon" type="number" step="any" value="${p.lon ?? ''}">
          </div>
        </div>
        <div class="field">
          <label>Place</label>
          <input id="f_place" type="text" autocomplete="off" list="placeOptions" value="${p.place ?? ''}">
          <datalist id="placeOptions">${placeOptions.map(o => `<option value="${o}">`).join('')}</datalist>
        </div>
        <div class="row">
          <button class="secondary" id="btnGeocode">Look up place from lat/lon</button>
        </div>
        <div class="row">
          <button id="btnSave">Save</button>
          <span class="status" id="saveStatus"></span>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <button class="secondary" id="btnPrev">&larr; Prev</button>
      <button class="secondary" id="btnNext">Next &rarr;</button>
      <button class="danger" id="btnDelete">Delete photo</button>
    </div>
  `;
  $('btnPrev').onclick = () => { if (selectedIndex > 0) { selectedIndex--; renderList(); renderEditor(); } };
  $('btnNext').onclick = () => { if (selectedIndex < photos.length - 1) { selectedIndex++; renderList(); renderEditor(); } };
  renderPreview(p);
  $('btnSave').onclick = save;
  $('f_place').addEventListener('change', save);
  $('btnGeocode').onclick = geocode;
  [...document.querySelectorAll('.status-switch button')].forEach(btn => {
    btn.onclick = () => { if (btn.dataset.status !== p.status) setStatus(btn.dataset.status); };
  });
  $('btnDelete').onclick = deletePhoto;
  [...document.querySelectorAll('.move-account-btn')].forEach(btn => {
    btn.onclick = () => moveToAccount(btn.dataset.to);
  });
}

function statusSwitch(p) {
  return p.status === 'posted' ? '<div class="status-note">Posted</div>' : `
    <div class="status-switch">
      ${STATUS_CHOICES.map(([s, label]) =>
        `<button class="${p.status === s ? 'on' : ''}" data-status="${s}">${label}</button>`).join('')}
    </div>
    <div class="status-note">${STATUS_NOTES[p.status] || ''}</div>`;
}

function renderGroupEditor(g) {
  const posted = g.status === 'posted';
  const n = g.photos.length;
  $('editor').innerHTML = `
    <div class="editor-top">
      <div class="editor-image">
        ${mosaic(g.photos.map(x => x.filename))}
        <div class="meta-line" style="margin-top:8px">Group of ${n} &middot; posted together as one ${platform === 'instagram' ? 'carousel' : 'post'} &middot; ${g.date_taken || 'no date'} &middot; ${g.status}</div>
      </div>
      <div class="editor-fields">
        <div>${statusSwitch(g)}${posted ? '' : '<div class="status-note">Status applies to every photo in the group.</div>'}</div>
        <div class="field">
          <label>Message for the post</label>
          <textarea id="f_msg" placeholder="One message for all ${n} photos; feed and location hashtags are added automatically" ${posted ? 'disabled' : ''}>${esc(g.message)}</textarea>
        </div>
        <div class="field">
          <label>Place (for the location hashtags)</label>
          <input id="f_place" type="text" autocomplete="off" list="placeOptions" value="${esc(g.place)}" ${posted ? 'disabled' : ''}>
          <datalist id="placeOptions">${placeOptions.map(o => `<option value="${esc(o)}">`).join('')}</datalist>
        </div>
        <div class="field">
          <label>Post preview</label>
          <div class="preview" id="f_preview"></div>
        </div>
        <label style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.04em">Photos, in posting order, each with its own alt text</label>
        ${g.photos.map((x, i) => `
          <div class="group-photo">
            <img src="${imgUrl(x.filename)}">
            <div class="field">
              <label>${x.filename} &middot; ${x.date_taken || 'no date'}</label>
              <textarea class="f_group_alt" data-file="${esc(x.filename)}" ${posted ? 'disabled' : ''}>${esc(x.alt_text)}</textarea>
              ${posted ? '' : `<div class="actions">
                <button class="secondary" data-move="${i}" data-by="-1" ${i === 0 ? 'disabled' : ''}>&larr; Earlier</button>
                <button class="secondary" data-move="${i}" data-by="1" ${i === n - 1 ? 'disabled' : ''}>Later &rarr;</button>
                <button class="secondary" data-remove="${i}">Remove from group</button>
              </div>`}
            </div>
          </div>`).join('')}
        ${posted ? '' : `<div class="row">
          <button id="btnSave">Save</button>
          <span class="status" id="saveStatus"></span>
        </div>`}
      </div>
    </div>
    <div class="toolbar">
      <button class="secondary" id="btnPrev">&larr; Prev</button>
      <button class="secondary" id="btnNext">Next &rarr;</button>
      ${posted ? '' : '<button class="danger" id="btnUngroup">Ungroup</button>'}
    </div>
  `;
  $('btnPrev').onclick = () => { if (selectedIndex > 0) { selectedIndex--; renderList(); renderEditor(); } };
  $('btnNext').onclick = () => { if (selectedIndex < photos.length - 1) { selectedIndex++; renderList(); renderEditor(); } };
  renderPreview(g);
  if (posted) return;
  $('btnSave').onclick = save;
  $('f_place').addEventListener('change', save);
  [...document.querySelectorAll('.status-switch button')].forEach(btn => {
    btn.onclick = () => { if (btn.dataset.status !== g.status) setStatus(btn.dataset.status); };
  });
  [...document.querySelectorAll('[data-move]')].forEach(btn => {
    btn.onclick = () => {
      const files = g.photos.map(x => x.filename), i = +btn.dataset.move, j = i + +btn.dataset.by;
      [files[i], files[j]] = [files[j], files[i]];
      updateGroupPhotos(g, files);
    };
  });
  [...document.querySelectorAll('[data-remove]')].forEach(btn => {
    btn.onclick = () => {
      const files = g.photos.map(x => x.filename).filter((_, i) => i !== +btn.dataset.remove);
      if (files.length < 2 && !confirm('That leaves one photo, so the group will be ungrouped. Continue?')) return;
      updateGroupPhotos(g, files);
    };
  });
  $('btnUngroup').onclick = async () => {
    if (!confirm(`Ungroup these ${n} photos? They become separate posts again; nothing is deleted.`)) return;
    await save();
    await fetch(`/api/groups/${currentAccount}/${g.id}`, {method: 'DELETE'});
    await loadPhotos();
  };
}

async function updateGroupPhotos(g, files) {
  await save();
  const resp = await fetch(`/api/groups/${currentAccount}/${g.id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({photos: files})
  });
  if (!resp.ok) { alert(`Couldn\u2019t change the group: ${await resp.text().catch(() => resp.statusText)}`); return; }
  const updated = await resp.json();
  if (updated.dissolved) { await loadPhotos(); return; }
  photos[selectedIndex] = updated;
  renderList();
  renderEditor();
}

async function saveGroup() {
  const g = photos[selectedIndex];
  if (g.status === 'posted') return;
  // Each photo's alt text, then the group's message and place.
  for (const ta of document.querySelectorAll('.f_group_alt')) {
    const x = g.photos.find(x => x.filename === ta.dataset.file);
    if (x && ta.value !== (x.alt_text || '')) {
      await fetch(`/api/photos/${currentAccount}/${encodeURIComponent(x.filename)}`, {
        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({alt_text: ta.value})
      });
      x.alt_text = ta.value;
    }
  }
  const body = {message: $('f_msg').value, place: $('f_place').value};
  const updated = await fetch(`/api/groups/${currentAccount}/${g.id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  }).then(r => r.json());
  Object.assign(g, updated);
  renderPreview(g);
  if (body.place && !placeOptions.includes(body.place)) placeOptions.push(body.place);
  $('saveStatus').textContent = 'Saved';
  setTimeout(() => { const s = $('saveStatus'); if (s) s.textContent = ''; }, 1500);
  renderList();
}

function renderPreview(p) {
  const text = p.post_preview || '';
  $('f_preview').textContent = text;
  const n = document.createElement('div');
  n.className = 'count';
  const tags = (text.match(/#\w+/g) || []).length;
  n.textContent = `${[...text].length} / ${limits.max_chars} characters`
    + (limits.max_hashtags ? ` \u00b7 ${tags} / ${limits.max_hashtags} hashtags` : '');
  $('f_preview').appendChild(n);
}

async function moveToAccount(toAccount) {
  const p = photos[selectedIndex];
  if (!confirm(`Move ${p.filename} to ${toAccount}? It will land in that account's holding-pen for review.`)) {
    return;
  }
  await save(); // persist any unsaved edits before the file moves
  const resp = await fetch(`/api/photos/${currentAccount}/${encodeURIComponent(p.filename)}/account`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({to_account: toAccount})
  });
  if (!resp.ok) {
    const text = await resp.text().catch(() => resp.statusText);
    alert(`Move failed: ${text}`);
    return;
  }
  photos.splice(selectedIndex, 1);
  if (selectedIndex >= photos.length) selectedIndex = photos.length - 1;
  loadStreamInfo();
  renderList();
  renderEditor();
}

async function deletePhoto() {
  const p = photos[selectedIndex];
  if (!confirm(`Permanently delete ${p.filename}? This removes the file and its metadata. Cannot be undone.`)) {
    return;
  }
  await fetch(`/api/photos/${currentAccount}/${encodeURIComponent(p.filename)}`, {method: 'DELETE'});
  photos.splice(selectedIndex, 1);
  if (selectedIndex >= photos.length) selectedIndex = photos.length - 1;
  loadStreamInfo();
  renderList();
  renderEditor();
}

const STATUS_CHOICES = [['holding-pen', 'Holding pen'], ['curated', 'Curated'], ['up-next', 'Up next']];
const STATUS_NOTES = {
  'holding-pen': 'Not posted until it\u2019s moved to Curated or Up next.',
  'curated': 'Ready to post; picked by season and region.',
  'up-next': 'Posted before anything in Curated, top of the Up next list first.',
};

async function setStatus(newStatus) {
  await save(); // persist any unsaved edits before the file moves
  const p = photos[selectedIndex];
  const resp = await fetch(`/api/photos/${currentAccount}/${encodeURIComponent(itemFilename(p))}/status`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status: newStatus})
  });
  if (!resp.ok) {
    alert(`Move failed: ${await resp.text().catch(() => resp.statusText)}`);
    return;
  }
  p.status = (await resp.json()).status;
  if (p.kind === 'group') p.photos.forEach(x => { x.status = p.status; });

  const currentFilter = $('status').value;
  if (currentFilter !== 'all' && currentFilter !== p.status) {
    photos.splice(selectedIndex, 1);
    if (selectedIndex >= photos.length) selectedIndex = photos.length - 1;
  }
  loadStreamInfo();
  renderList();
  renderEditor();
}

async function save() {
  const p = photos[selectedIndex];
  if (p.kind === 'group') return saveGroup();
  const body = {
    alt_text: $('f_alt').value,
    message: $('f_msg').value,
    lat: $('f_lat').value,
    lon: $('f_lon').value,
    place: $('f_place').value,
  };
  const updated = await fetch(`/api/photos/${currentAccount}/${encodeURIComponent(p.filename)}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  }).then(r => r.json());
  Object.assign(photos[selectedIndex], updated);
  renderPreview(photos[selectedIndex]);
  if (body.place && !placeOptions.includes(body.place)) placeOptions.push(body.place);
  $('saveStatus').textContent = 'Saved';
  setTimeout(() => { const s = $('saveStatus'); if (s) s.textContent = ''; }, 1500);
  renderList();
}

async function geocode() {
  await save();
  const p = photos[selectedIndex];
  const updated = await fetch(`/api/photos/${currentAccount}/${encodeURIComponent(p.filename)}/geocode`, {method: 'POST'}).then(r => r.json());
  Object.assign(photos[selectedIndex], updated);
  renderEditor();
}

['account', 'status', 'q', 'hasGeo', 'hasAlt', 'dateFrom', 'dateTo'].forEach(id => {
  $(id).addEventListener('change', loadPhotos);
});
$('btnGroup').addEventListener('click', createGroup);
$('btnClearChecks').addEventListener('click', () => { checked = []; renderList(); });
$('q').addEventListener('keyup', (e) => { if (e.key === 'Enter') loadPhotos(); });

$('btnSyncLocations').addEventListener('click', async () => {
  const account = $('account').value;
  $('syncResult').textContent = 'Syncing…';
  const summary = await fetch(`/api/sync-locations/${account}`, {method: 'POST'}).then(r => r.json());
  $('syncResult').textContent =
    `Checked ${summary.checked}, alt text +${summary.alt_text_updated}`;
  loadPhotos();
});

loadAccounts().then(async () => { $('account').value = currentAccount; await loadPlaceOptions(); loadPhotos(); });
</script>
</body>
